# Install ONLY after TLS certificates exist for superformersmusic.com.
# This site uses the commercial TrustAsia nginx bundle, not Let's Encrypt:
#
#   sudo mkdir -p /opt/bittune/certs /etc/nginx/snippets
#   sudo cp superformersmusic.com_bundle.pem /opt/bittune/certs/
#   sudo cp superformersmusic.com.key /opt/bittune/certs/
#   sudo chmod 600 /opt/bittune/certs/superformersmusic.com.key
#   sudo cp deploy/nginx/app_locations.inc /etc/nginx/snippets/bittune_locations.inc
#   sudo cp deploy/nginx/https.superformersmusic.com.conf /etc/nginx/conf.d/bittune.conf
#   sudo nginx -t && sudo nginx -s reload
#
# Then set FRONTEND_BASE_URL=https://superformersmusic.com
# and API_PUBLIC_URL=https://superformersmusic.com/api/v1
# Do not enable this file before the certs are on disk — HTTP users would be
# redirected to an empty HTTPS listener.
# The cert is hostname-only: keep the bare IP on HTTP and do not 301 it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 139.199.90.218 _;
    server_tokens off;
    set $bittune_hsts "";
    include /etc/nginx/snippets/bittune_locations.inc;
}

server {
    listen 80;
    listen [::]:80;
    server_name superformersmusic.com www.superformersmusic.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://superformersmusic.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.superformersmusic.com;
    server_tokens off;

    ssl_certificate     /opt/bittune/certs/superformersmusic.com_bundle.pem;
    ssl_certificate_key /opt/bittune/certs/superformersmusic.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://superformersmusic.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name superformersmusic.com;
    server_tokens off;

    ssl_certificate     /opt/bittune/certs/superformersmusic.com_bundle.pem;
    ssl_certificate_key /opt/bittune/certs/superformersmusic.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    set $bittune_hsts "max-age=604800";
    include /etc/nginx/snippets/bittune_locations.inc;
}
