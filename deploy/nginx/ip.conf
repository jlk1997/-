map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP for the live IP and superformersmusic.com.
# Do not install HTTPS 301 here until certificates exist.
# When certs are on disk, swap in deploy/nginx/https.superformersmusic.com.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 139.199.90.218 superformersmusic.com www.superformersmusic.com _;
    server_tokens off;
    set $bittune_hsts "";
    include /etc/nginx/snippets/bittune_locations.inc;
}
